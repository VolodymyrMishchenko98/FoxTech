{% extends 'base.html' %}

{% block title %}Видалення товару | FoxTech{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="h3 mb-3">Видалити товар?</h1>
                <p>
                    Товар <strong>{{ object.title }}</strong> буде видалено безповоротно.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button class="btn btn-danger" type="submit">
                            Видалити
                        </button>
                        <a class="btn btn-outline-secondary" href="{{ object.get_absolute_url }}">
                            Скасувати
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
