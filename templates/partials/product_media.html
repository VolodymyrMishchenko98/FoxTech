{% with has_image=image_src %}
    {% if has_image %}
        <img
            src="{{ image_src }}"
            alt="{{ image_alt|default:'' }}"
            {% if loading %}loading="{{ loading }}"{% endif %}
            {% if fetchpriority %}fetchpriority="{{ fetchpriority }}"{% endif %}
            decoding="async"
            class="{{ image_class|default:'' }}"
            onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"
        >
    {% endif %}
    <div class="{% if has_image %}hidden{% else %}flex{% endif %} {{ placeholder_class|default:'' }}">
        <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-white shadow-lg ring-1 ring-slate-100">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="6" width="16" height="13" rx="3" stroke="#64748b" stroke-width="1.8"/>
                <path d="M8 6V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V6" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="12.5" r="3.5" stroke="#94a3b8" stroke-width="1.5"/>
                <circle cx="13.5" cy="11" r="1" fill="#94a3b8"/>
            </svg>
        </div>
        <p class="text-sm font-semibold text-slate-800">{{ placeholder_title|default:'Image not added' }}</p>
        <p class="mt-1 text-xs text-slate-500">{{ placeholder_text|default:'Add a photo for a better product view' }}</p>
    </div>
{% endwith %}
