services:
  - type: web
    name: foxtech
    env: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn foxtech.wsgi:application --log-file -"
    releaseCommand: "python manage.py migrate --noinput --verbosity=2"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: foxtech.onrender.com,foxtech-vtmj.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: foxtech-db
          property: connectionString

databases:
  - name: foxtech-db
    plan: free
    databaseName: foxtech
    user: foxtech
