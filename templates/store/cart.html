{% extends 'base.html' %}
{% load static %}

{% block title %}Кошик | FoxTech{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl">
    <h1 class="mb-6 text-3xl font-bold text-slate-900">Кошик</h1>

    <div id="cart-messages"></div>

    <div id="cart-content">
        <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Товар</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Ціна</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Кількість</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Сума</th>
                        <th class="px-6 py-3"></th>
                    </tr>
                </thead>
                <tbody id="cart-items-body" class="divide-y divide-slate-200">
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex items-center justify-between">
            <div class="text-lg font-semibold text-slate-900">
                Разом: <span id="cart-total">0.00</span> грн
            </div>
            <div id="cart-count-info" class="text-sm text-slate-500"></div>
        </div>

        <div class="mt-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="mb-4 text-lg font-semibold text-slate-900">Промокод</h2>
            <div id="promo-applied" class="hidden mb-4 flex items-center gap-3 rounded-2xl border border-orange-100 bg-orange-50 px-4 py-3">
                <span class="text-sm font-medium text-orange-700">
                    Промокод <span id="promo-applied-code" class="font-semibold"></span> застосовано: -<span id="promo-applied-percent"></span>%
                </span>
                <button type="button" id="promo-remove-btn" class="ml-auto text-sm font-medium text-orange-600 hover:text-orange-700">Скинути</button>
            </div>
            <form id="promo-form" class="flex gap-2" onsubmit="event.preventDefault();">
                <input type="text" id="promo-input" placeholder="Введіть промокод" class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:border-orange-600">
                <button type="submit" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-orange-600">Застосувати</button>
            </form>
            <p id="promo-message" class="mt-2 text-sm"></p>
        </div>
    </div>
</div>
{% endblock %}
